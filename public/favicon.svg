<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#0b0f19"/>
  
  <!-- CPU chip body -->
  <rect x="20" y="20" width="24" height="24" rx="4" stroke="#3b82f6" stroke-width="2" fill="#0f172a"/>
  
  <!-- Inner chip detail -->
  <rect x="24" y="24" width="16" height="16" rx="2" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>

  <!-- Pulse / activity waveform inside chip -->
  <polyline
    points="25,32 28,32 29.5,27 31,37 32.5,29 34,35 35.5,32 39,32"
    stroke="#3b82f6"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Circuit traces - TOP -->
  <line x1="27" y1="20" x2="27" y2="14" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="20" x2="32" y2="11" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="20" x2="37" y2="14" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- Endpoint dots - top -->
  <circle cx="27" cy="14" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="32" cy="11" r="1.5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="37" cy="14" r="1.5" fill="#3b82f6" opacity="0.7"/>

  <!-- Circuit traces - BOTTOM -->
  <line x1="27" y1="44" x2="27" y2="50" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="44" x2="32" y2="53" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="44" x2="37" y2="50" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- Endpoint dots - bottom -->
  <circle cx="27" cy="50" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="32" cy="53" r="1.5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="37" cy="50" r="1.5" fill="#3b82f6" opacity="0.7"/>

  <!-- Circuit traces - LEFT -->
  <line x1="20" y1="27" x2="14" y2="27" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="32" x2="11" y2="32" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="37" x2="14" y2="37" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- Endpoint dots - left -->
  <circle cx="14" cy="27" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="11" cy="32" r="1.5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="14" cy="37" r="1.5" fill="#3b82f6" opacity="0.7"/>

  <!-- Circuit traces - RIGHT -->
  <line x1="44" y1="27" x2="50" y2="27" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="44" y1="32" x2="53" y2="32" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="44" y1="37" x2="50" y2="37" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- Endpoint dots - right -->
  <circle cx="50" cy="27" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="53" cy="32" r="1.5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="50" cy="37" r="1.5" fill="#3b82f6" opacity="0.7"/>
</svg>